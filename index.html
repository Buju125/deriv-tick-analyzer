<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Multi-Timezone Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🕐 Digital Multi-Timezone Clock</h1>
        
        <div class="controls">
            <input type="text" id="timezoneInput" placeholder="Add timezone (e.g., America/New_York)">
            <button onclick="addTimezone()">+ Add Timezone</button>
            <button onclick="resetToDefault()" class="reset-btn">Reset to Default</button>
        </div>

        <div class="clocks-grid" id="clocksContainer">
            <!-- Clocks will be dynamically inserted here -->
        </div>

        <div class="timezone-list">
            <h3>Available Timezones:</h3>
            <div id="timezoneList" class="timezone-options"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
